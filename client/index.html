    <script>
      (() => {
        try {
          const key = "baby-tools:theme:v1";
          const saved = localStorage.getItem(key);
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            saved === "dark" || saved === "light" ? saved : prefersDark ? "dark" : "light";

          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          // no-op
        }
      })();
    </script>
    <!-- Critical CSS: baby 테마 — 소비·생활 그룹 청록 -->
    <style>
      :root {
        /* v3 §2.1 역할 토큰 — canvas/card/ink/ink-muted/line/focus는 hex에서 역산(반올림 왕복 검증 완료) */
        --background: 60 11.11% 96.47%; /* color.canvas #F7F7F5 */
        --foreground: 0 0% 3.92%; /* color.ink #0A0A0A */
        --muted: 210 40% 96%;
        --muted-foreground: 60 3.37% 34.9%; /* color.ink-muted #5C5C56 */
        --card: 0 0% 100%; /* color.card #FFFFFF */
        --card-foreground: 0 0% 3.92%;
        /* 소비·생활 그룹(card·nutri·baby) 공통 청록. 세 앱이 같은 리터럴을 쓰므로
           앱마다 재계산하지 않는다 — scripts/verify-accent-tokens.mjs가 문자열로 대조한다.
           폐기한 자홍(330)은 v3 §4.5가 "낮은 채도로 칩·underline만"으로 제한한 색인데
           실제로는 내비·버튼·히어로까지 브랜드 전반에 쓰이고 있었다. 그룹 hue로 흡수한다.
           --accent-foreground는 파생 공식값 30%가 아니라 28%다: 30%는 이 틴트 위
           4.37:1로 AA 미달이고 28%는 4.92:1이다(공식보다 실측이 이긴다). */
        --primary: 174 70% 24%;
        --primary-foreground: 0 0% 100%;
        --secondary: 174 15% 91%;
        --secondary-foreground: 222 47% 11%;
        --accent: 174 68% 95%;
        --accent-foreground: 174 70% 28%;
        --popover: 0 0% 100%;
        --popover-foreground: 222 47% 11%;
        /* v3 §2.1 고정 위험색(#C62828)의 HSL 역산. --status-danger와 같은 리터럴을 쓴다 —
           갈라지면 같은 화면에 빨강이 두 종류로 찍힌다. 텍스트가 실제로 얹히는 세 표면
           (--background·--card·--muted)은 verify-token-contrast.mjs가 매 빌드 재측정한다. */
        --destructive: 0 66.4% 46.7%;
        --destructive-foreground: 210 40% 98%;
        --border: 60 8% 90.2%; /* color.line #E8E8E4 */
        --input: 214 16% 85%;
        /* 그룹 확정 표(계획서 §2.2)가 --ring을 액센트로 고정한다. card는 이미 그랬고
           세 앱이 같은 값을 써야 게이트가 문자열로 대조할 수 있다. 흰 카드 위 6.61:1로
           비텍스트 기준(3:1)을 크게 넘는다. */
        --ring: 174 70% 24%;
        --radius: 0.4rem;
      }

      .dark {
        --background: 0 0% 7.06%; /* color.canvas dark #121212 */
        --foreground: 0 0% 96.08%; /* color.ink dark #F5F5F5 */
        --muted: 217 33% 17%;
        --muted-foreground: 60 3.33% 64.71%; /* color.ink-muted dark #A8A8A2 */
        --card: 0 0% 10.98%; /* color.card dark #1C1C1C */
        --card-foreground: 0 0% 96.08%;
        /* 자홍 70%는 "밝은 브랜드색"이라 틴트가 배경까지 같이 밝혀 상쇄가 컸다(3층 틴트가
           68%부터 겨우 통과). 청록 45%는 반대로 표면을 어둡게 유지해 같은 틴트들이
           훨씬 여유 있게 통과한다 — 게이트(verify-token-contrast.mjs)가 4개 틴트 조합을
           매 빌드 재계산하므로 이 주장은 빌드가 증명한다. */
        --primary: 174 70% 45%;
        --primary-foreground: 174 70% 10%;
        --secondary: 174 15% 20%;
        --secondary-foreground: 210 40% 96%;
        --accent: 174 50% 22%;
        --accent-foreground: 174 70% 78%;
        --popover: 0 0% 10.98%;
        --popover-foreground: 0 0% 96.08%;
        /* v3 §2.1 고정 다크 위험색(#F07171). 짝 전경은 흰색 대신 어둡게 내린다 —
           흰색을 유지하면 이 밝기 위에서 2.88:1로 오히려 더 나빠진다. */
        --destructive: 0 80.9% 69.2%;
        --destructive-foreground: 0 70% 10%;
        --border: 0 0% 16.47%; /* color.line dark #2A2A2A */
        --input: 214 16% 30%;
        --ring: 174 70% 45%;
      }

      html {
        scroll-behavior: auto;
        font-size: 16px;
      }

      body {
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        margin: 0;
        color-scheme: light dark;
      }
    </style>
